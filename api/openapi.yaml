openapi: 3.1.0
info:
  title: PMS Cloud API
  version: 0.1.0
  description: >
    Contract between the open source dashboard and the private PMS Cloud backend.
    All calls need `Authorization: Bearer <supabase access token>`.
servers:
  - url: https://api.pmservers.org
security:
  - bearer: []
paths:
  /v1/me:
    get:
      operationId: getMe
      responses:
        '200':
          {
            description: The user,
            content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/catalog:
    get:
      operationId: getCatalog
      responses:
        '200':
          {
            description: Options for create forms,
            content: { application/json: { schema: { $ref: '#/components/schemas/Catalog' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects:
    get:
      operationId: listProjects
      responses:
        '200':
          {
            description: Projects,
            content: { application/json: { schema: { $ref: '#/components/schemas/ProjectList' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectCreate' } } }
      responses:
        '201':
          {
            description: Created,
            content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: getProject
      responses:
        '200':
          {
            description: Project,
            content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectUpdate' } } }
      responses:
        '200':
          {
            description: Updated,
            content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProject
      responses:
        '202': { description: Accepted. 403 if the user is a member and not the owner. }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/members:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: listMembers
      responses:
        '200':
          {
            description: The owner first,
            then the members,
            content: { application/json: { schema: { $ref: '#/components/schemas/MemberList' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: addMember
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemberCreate' } } }
      responses:
        '201':
          {
            description: Added at once. Owner only (403). A new email gets an invite email. 409 if already a member.,
            content: { application/json: { schema: { $ref: '#/components/schemas/MemberAdded' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/members/{user_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: user_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: removeMember
      responses:
        '204':
          {
            description: Removed. The owner removes a member,
            or a member removes themselves to leave.,
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/usage:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: getUsage
      responses:
        '200':
          {
            description: Usage,
            content: { application/json: { schema: { $ref: '#/components/schemas/Usage' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/events:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: listEvents
      responses:
        '200':
          {
            description: Activity,
            newest first,
            content: { application/json: { schema: { $ref: '#/components/schemas/EventList' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/vms:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: listVms
      responses:
        '200':
          {
            description: VMs,
            content: { application/json: { schema: { $ref: '#/components/schemas/VmList' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createVm
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VmCreate' } } }
      responses:
        '202':
          {
            description: Accepted,
            content: { application/json: { schema: { $ref: '#/components/schemas/Vm' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/vms/{vm_id}:
    parameters:
      [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/VmId' }]
    get:
      operationId: getVm
      responses:
        '200':
          {
            description: VM,
            content: { application/json: { schema: { $ref: '#/components/schemas/Vm' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteVm
      responses:
        '202': { description: Accepted }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/vms/{vm_id}/actions:
    parameters:
      [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/VmId' }]
    post:
      operationId: vmAction
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VmAction' } } }
      responses:
        '202':
          {
            description: Accepted,
            content: { application/json: { schema: { $ref: '#/components/schemas/Vm' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/vms/{vm_id}/metrics:
    parameters:
      [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/VmId' }]
    get:
      operationId: getVmMetrics
      responses:
        '200':
          {
            description: CPU series for the last hour,
            content: { application/json: { schema: { $ref: '#/components/schemas/VmMetrics' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/events/ticket:
    post:
      operationId: createEventsTicket
      description: Get a short-lived ticket (60 s) to open the event stream.
      responses:
        '200':
          {
            description: Ticket,
            content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/events/stream:
    get:
      operationId: streamEvents
      description: >
        Server-sent events for all projects of the user. Authenticate with `?ticket=` from
        `POST /v1/events/ticket`, because `EventSource` cannot send headers. Each message has
        `id`, `event: event` and `data` with a StreamEvent as JSON. After a reconnect, send
        `Last-Event-ID` to get missed events first. A `: ping` comment comes every 15 s.
      security: []
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          {
            description: Event stream,
            content:
              { text/event-stream: { schema: { $ref: '#/components/schemas/StreamEvent' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/vms/{vm_id}/console/ticket:
    parameters:
      [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/VmId' }]
    post:
      operationId: createConsoleTicket
      description: >
        Get a ticket (60 s) for the serial console. The VM must be `running`, else `409`.
        Then open a WebSocket at `url` (same host, `ws` or `wss`). OpenAPI 3.1 cannot
        describe WebSockets, so the socket is described here. Messages are binary frames
        with raw terminal bytes in both directions. The server closes the socket when the VM
        stops, after 30 minutes with no data, or when another console opens.
      responses:
        '200':
          {
            description: Ticket,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ConsoleTicket' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/ai-keys:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: listAiKeys
      responses:
        '200':
          {
            description: AI keys,
            content: { application/json: { schema: { $ref: '#/components/schemas/AiKeyList' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createAiKey
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AiKeyCreate' } } }
      responses:
        '201':
          {
            description: Created. The secret is shown once.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AiKeyCreated' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/ai-keys/{key_id}:
    parameters:
      [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/KeyId' }]
    get:
      operationId: getAiKey
      responses:
        '200':
          {
            description: AI key,
            content: { application/json: { schema: { $ref: '#/components/schemas/AiKey' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateAiKey
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AiKeyUpdate' } } }
      responses:
        '200':
          {
            description: Updated,
            content: { application/json: { schema: { $ref: '#/components/schemas/AiKey' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAiKey
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/ai-keys/{key_id}/rotate:
    parameters:
      [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/KeyId' }]
    post:
      operationId: rotateAiKey
      responses:
        '200':
          {
            description: The new key. Shown once.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AiKeyCreated' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/ssh-keys:
    get:
      operationId: listSshKeys
      responses:
        '200':
          {
            description: Saved public keys. Newest first.,
            content: { application/json: { schema: { $ref: '#/components/schemas/SshKeyList' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createSshKey
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SshKeyCreate' } } }
      responses:
        '201':
          {
            description: Saved. 409 for a key that is already saved or after 20 keys.,
            content: { application/json: { schema: { $ref: '#/components/schemas/SshKey' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/ssh-keys/{key_id}:
    parameters: [{ $ref: '#/components/parameters/KeyId' }]
    delete:
      operationId: deleteSshKey
      responses:
        '204': { description: Deleted. VMs that already have the key keep it. }
        default: { $ref: '#/components/responses/Error' }
  /v1/account/access:
    get:
      operationId: getAccess
      description: The container access state of the signed-in user's account.
      responses:
        '200':
          {
            description: Access,
            content: { application/json: { schema: { $ref: '#/components/schemas/Access' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/account/access/request:
    post:
      operationId: requestAccess
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccessRequest' } } }
      responses:
        '200':
          {
            description: Access. 409 if the state is pending or approved.,
            content: { application/json: { schema: { $ref: '#/components/schemas/Access' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/registry-credentials:
    get:
      operationId: listRegistryCredentials
      responses:
        '200':
          {
            description: Registry credentials. Newest first.,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RegistryCredentialList' } },
              },
          }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createRegistryCredential
      requestBody:
        required: true
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/RegistryCredentialCreate' } },
          }
      responses:
        '201':
          {
            description: Saved. 10 at most. 409 if the name exists. The token is never returned.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/RegistryCredential' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/registry-credentials/{credential_id}:
    parameters: [{ name: credential_id, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteRegistryCredential
      responses:
        '204': { description: Deleted. 409 if a container uses it. }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/containers:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: listContainers
      responses:
        '200':
          {
            description: Containers. 403 not_allowed if the owner's account is not approved.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ContainerList' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createContainer
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ContainerCreate' } } }
      responses:
        '202':
          {
            description: Accepted,
            content: { application/json: { schema: { $ref: '#/components/schemas/Container' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/containers/{container_id}:
    parameters:
      [
        { $ref: '#/components/parameters/ProjectId' },
        { $ref: '#/components/parameters/ContainerId' },
      ]
    get:
      operationId: getContainer
      responses:
        '200':
          {
            description: Container,
            content: { application/json: { schema: { $ref: '#/components/schemas/Container' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateContainer
      description: Redeploy. `env` replaces all variables. `registry_credential_id` null removes it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ContainerUpdate' } } }
      responses:
        '202':
          {
            description: Accepted,
            content: { application/json: { schema: { $ref: '#/components/schemas/Container' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteContainer
      responses:
        '202': { description: Accepted }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/containers/{container_id}/actions:
    parameters:
      [
        { $ref: '#/components/parameters/ProjectId' },
        { $ref: '#/components/parameters/ContainerId' },
      ]
    post:
      operationId: containerAction
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VmAction' } } }
      responses:
        '202':
          {
            description: Accepted,
            content: { application/json: { schema: { $ref: '#/components/schemas/Container' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/databases:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: listDatabases
      responses:
        '200':
          {
            description: Databases,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DatabaseList' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createDatabase
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DatabaseCreate' } } }
      responses:
        '202':
          {
            description: 'Creating. The response has the password one time.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DatabaseSecret' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/databases/{database_id}:
    parameters:
      [
        { $ref: '#/components/parameters/ProjectId' },
        { $ref: '#/components/parameters/DatabaseId' },
      ]
    get:
      operationId: getDatabase
      responses:
        '200':
          {
            description: Database,
            content: { application/json: { schema: { $ref: '#/components/schemas/Database' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateDatabase
      description: Turn vector on or off. 409 if a column or index uses vector.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DatabaseUpdate' } } }
      responses:
        '202':
          {
            description: Updated,
            content: { application/json: { schema: { $ref: '#/components/schemas/Database' } } },
          }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDatabase
      description: No backups. The data is lost.
      responses:
        '202': { description: Deleting }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/databases/{database_id}/reset-password:
    parameters:
      [
        { $ref: '#/components/parameters/ProjectId' },
        { $ref: '#/components/parameters/DatabaseId' },
      ]
    post:
      operationId: resetDatabasePassword
      responses:
        '200':
          {
            description: 'A new password, one time.',
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DatabaseSecret' } } },
          }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{project_id}/containers/{container_id}/logs:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ContainerId' }
      - {
          name: tail,
          in: query,
          schema: { type: integer, minimum: 1, maximum: 2000, default: 200 },
        }
      - {
          name: previous,
          in: query,
          description: The run before the last restart (for a crash).,
          schema: { type: boolean, default: false },
        }
    get:
      operationId: getContainerLogs
      responses:
        '200':
          {
            description: The last log lines of the newest run,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ContainerLogs' } } },
          }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string } }
    VmId: { name: vm_id, in: path, required: true, schema: { type: string } }
    KeyId: { name: key_id, in: path, required: true, schema: { type: string } }
    ContainerId: { name: container_id, in: path, required: true, schema: { type: string } }
    DatabaseId: { name: database_id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [quota_exceeded] }
            message: { type: string }
    Status:
      type: string
      enum: [pending, provisioning, running, stopped, sleeping, failed, deleting, unknown]
    Me:
      type: object
      required: [id, email, plan]
      properties:
        id: { type: string }
        email: { type: string }
        plan: { type: string }
    Role:
      type: string
      enum: [owner, member]
    Project:
      type: object
      required: [id, name, region, role, created_at]
      properties:
        id: { type: string, examples: [prj_01] }
        name: { type: string }
        region: { type: string, examples: [ca-tor-1] }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      required: [user_id, email, role, created_at]
      properties:
        user_id: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
    MemberList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Member' } }
    MemberCreate:
      type: object
      required: [email]
      properties:
        email: { type: string }
    MemberAdded:
      allOf:
        - { $ref: '#/components/schemas/Member' }
        - type: object
          required: [invited]
          properties:
            invited:
              {
                type: boolean,
                description: True if the user had no account and got an invite email.,
              }
    ProjectList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Project' } }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
    UsageMetric:
      type: object
      required: [used, limit, series]
      properties:
        used: { type: number }
        limit: { type: number }
        series:
          type: array
          description: 28 daily values from 0 to 1, oldest first.
          items: { type: number }
    Usage:
      type: object
      required: [vcpu, memory_gib, storage_gb, ai_spend_usd]
      properties:
        vcpu: { $ref: '#/components/schemas/UsageMetric' }
        memory_gib: { $ref: '#/components/schemas/UsageMetric' }
        storage_gb: { $ref: '#/components/schemas/UsageMetric' }
        ai_spend_usd: { $ref: '#/components/schemas/UsageMetric' }
    Event:
      type: object
      required: [id, time, level, resource_id, resource_name, message]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        level: { type: string, enum: [info, success, warning, error] }
        resource_id: { type: string }
        resource_name: { type: string }
        message: { type: string }
    Ticket:
      type: object
      required: [ticket]
      properties:
        ticket: { type: string }
    ConsoleTicket:
      type: object
      required: [ticket, url]
      properties:
        ticket: { type: string }
        url: { type: string, description: Path and query for the WebSocket }
    StreamEvent:
      allOf:
        - { $ref: '#/components/schemas/Event' }
        - type: object
          required: [project_id]
          properties:
            project_id: { type: string }
    EventList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Event' } }
    Vm:
      type: object
      required:
        [
          id,
          name,
          status,
          status_message,
          size,
          image,
          disk_gb,
          private_ip,
          ssh_host,
          ssh_user,
          created_at,
        ]
      properties:
        id: { type: string, examples: [vm_01] }
        name: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        status_message: { type: [string, 'null'] }
        size: { type: string }
        image: { type: string }
        disk_gb: { type: integer }
        private_ip: { type: [string, 'null'] }
        ssh_host: { type: string }
        ssh_user: { type: string }
        created_at: { type: string, format: date-time }
    VmList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Vm' } }
    VmCreate:
      type: object
      required: [name, size, image, disk_gb, ssh_public_key]
      properties:
        name: { type: string }
        size: { type: string }
        image: { type: string }
        disk_gb: { type: integer }
        ssh_public_key: { type: string }
    VmAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [start, stop, restart] }
    VmMetrics:
      type: object
      required: [cpu]
      properties:
        cpu:
          type: array
          description: CPU use from 0 to 1 for the last hour.
          items: { type: number }
    AiKey:
      type: object
      required:
        [id, name, status, prefix, models, budget_usd, spend_usd, rate_limit_rpm, created_at]
      properties:
        id: { type: string, examples: [key_01] }
        name: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        prefix: { type: string }
        models: { type: array, items: { type: string } }
        budget_usd: { type: number }
        spend_usd: { type: number }
        rate_limit_rpm: { type: integer }
        created_at: { type: string, format: date-time }
    AiKeyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AiKey' } }
    SshKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        public_key: { type: string }
        fingerprint: { type: string, examples: ['SHA256:abc'] }
        created_at: { type: string, format: date-time }
    SshKeyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SshKey' } }
    SshKeyCreate:
      type: object
      required: [name, public_key]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        public_key: { type: string }
    AiKeyCreate:
      type: object
      required: [name, models, budget_usd]
      properties:
        name: { type: string }
        models: { type: array, items: { type: string } }
        budget_usd: { type: number }
    AiKeyUpdate:
      type: object
      properties:
        models: { type: array, items: { type: string } }
        budget_usd: { type: number }
    AiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/AiKey'
        - type: object
          required: [secret]
          properties:
            secret: { type: string }
    Catalog:
      type: object
      required: [vm_sizes, vm_images, container_sizes, database_sizes, ai_models, regions]
      properties:
        regions: { type: array, items: { type: string } }
        vm_sizes:
          type: array
          items:
            type: object
            required: [id, vcpu, memory_gib]
            properties:
              id: { type: string }
              vcpu: { type: number }
              memory_gib: { type: number }
        vm_images:
          type: array
          items:
            type: object
            required: [id, name, version]
            properties:
              id: { type: string }
              name: { type: string }
              version: { type: string }
        container_sizes:
          type: array
          items:
            type: object
            required: [id, vcpu, memory_mib]
            properties:
              id: { type: string, examples: [pms-c-250m-512] }
              vcpu: { type: number }
              memory_mib: { type: integer }
        database_sizes:
          type: array
          items:
            type: object
            required: [id, vcpu, memory_mib]
            properties:
              id: { type: string, examples: [pms-db-250m-512] }
              vcpu: { type: number }
              memory_mib: { type: integer }
        ai_models:
          type: array
          items:
            type: object
            required: [id, type, description, detail]
            properties:
              id: { type: string }
              type: { type: string, enum: [llm, embedding, decision] }
              description: { type: string }
              detail: { type: string, description: 'Context size, vector dims or latency.' }
    Runtime:
      type: string
      enum: [gvisor, native]
    Access:
      type: object
      required: [access, runtime, vcluster, reason, note, requested_at, decided_at]
      properties:
        access: { type: string, enum: [none, pending, approved, rejected] }
        runtime: { $ref: '#/components/schemas/Runtime' }
        vcluster: { type: string, enum: [none, creating, ready, failed, deleting] }
        reason: { type: [string, 'null'] }
        note: { type: [string, 'null'], description: The admin's message to the customer. }
        requested_at: { type: [string, 'null'], format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
    AccessRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    RegistryCredential:
      type: object
      required: [id, name, host, username, created_at]
      properties:
        id: { type: string, examples: [reg_01] }
        name: { type: string }
        host: { type: string, examples: [ghcr.io] }
        username: { type: string }
        created_at: { type: string, format: date-time }
    RegistryCredentialList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RegistryCredential' } }
    RegistryCredentialCreate:
      type: object
      required: [name, host, username, token]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        host: { type: string }
        username: { type: string }
        token: { type: string, description: Write-only. }
    Container:
      type: object
      required:
        [
          id,
          name,
          type,
          image,
          size,
          vcpu,
          memory_mib,
          registry_credential_id,
          env_names,
          runtime,
          ports,
          internal_host,
          status,
          status_message,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, examples: [ctr_01] }
        name: { type: string }
        type: { type: string, enum: [worker] }
        image: { type: string }
        size: { type: string }
        vcpu: { type: [number, 'null'] }
        memory_mib: { type: [integer, 'null'] }
        registry_credential_id: { type: [string, 'null'] }
        env_names: { type: array, items: { type: string }, description: Values are never returned. }
        runtime: { $ref: '#/components/schemas/Runtime' }
        ports: { type: array, items: { type: integer }, description: Private TCP ports. At most 5. }
        internal_host:
          type: [string, 'null']
          description: >-
            The name that other containers in the same project use, as host:port.
            Null when the container has no ports.
        status: { $ref: '#/components/schemas/Status' }
        status_message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContainerList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Container' } }
    ContainerCreate:
      type: object
      required: [name, type, image, size]
      properties:
        name: { type: string }
        type: { type: string, enum: [worker] }
        image: { type: string }
        size: { type: string }
        registry_credential_id: { type: [string, 'null'] }
        env: { type: object, additionalProperties: { type: string } }
        runtime: { $ref: '#/components/schemas/Runtime' }
        ports:
          type: array
          items: { type: integer, minimum: 1, maximum: 65535 }
          maxItems: 5
          uniqueItems: true
          description: Private TCP ports. In an update, [] removes all ports. Omit to keep them.
    ContainerUpdate:
      type: object
      properties:
        image: { type: string }
        size: { type: string }
        registry_credential_id: { type: [string, 'null'] }
        env: { type: object, additionalProperties: { type: string } }
        runtime: { $ref: '#/components/schemas/Runtime' }
        ports:
          type: array
          items: { type: integer, minimum: 1, maximum: 65535 }
          maxItems: 5
          uniqueItems: true
          description: Private TCP ports. In an update, [] removes all ports. Omit to keep them.
    DatabaseStatus:
      type: string
      enum: [provisioning, running, read_only, suspended, failed, deleting, unknown]
    Database:
      type: object
      required:
        [
          id,
          name,
          engine,
          size,
          vcpu,
          memory_mib,
          vector,
          status,
          status_message,
          host,
          port,
          database,
          user,
          used_bytes,
          storage_limit_bytes,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, examples: [db_01] }
        name: { type: string }
        engine: { type: string, enum: [postgres] }
        size: { type: string }
        vcpu: { type: [number, 'null'] }
        memory_mib: { type: [integer, 'null'] }
        vector: { type: boolean }
        status: { $ref: '#/components/schemas/DatabaseStatus' }
        status_message: { type: [string, 'null'] }
        host: { type: string }
        port: { type: integer }
        database: { type: string }
        user: { type: string }
        used_bytes: { type: integer }
        storage_limit_bytes:
          { type: integer, description: The limit for all databases of the account. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DatabaseSecret:
      allOf:
        - $ref: '#/components/schemas/Database'
        - type: object
          required: [password, connection_url]
          properties:
            password: { type: string, description: Shown one time. }
            connection_url: { type: string, description: Shown one time. }
    DatabaseList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Database' } }
    DatabaseCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        size: { type: string }
        vector: { type: boolean }
    DatabaseUpdate:
      type: object
      properties:
        vector: { type: boolean }
    ContainerLogs:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [time, message]
            properties:
              time: { type: string }
              message: { type: string }
