<title>PMS Cloud Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with breadcrumb project switcher and tabs; card grids per service; side sheet for detail; centered dialog for create; ⌘K palette. Dark first. */
:root {
  --bg: #08090b;
  --bg-glow: rgba(79,124,255,.13);
  --panel: #101114;
  --panel-2: #15161a;
  --line: #22242a;
  --line-strong: #2e3038;
  --fg: #f4f5f7;
  --muted: #8d919c;
  --faint: #5d616b;
  --accent: #5b8cff;
  --accent-2: #9b7bff;
  --accent-soft: rgba(91,140,255,.14);
  --on-accent: #ffffff;
  --ok: #3ddc84; --ok-soft: rgba(61,220,132,.12);
  --warn: #f5b84a; --warn-soft: rgba(245,184,74,.12);
  --bad: #ff6b6b; --bad-soft: rgba(255,107,107,.12);
  --idle: #8d919c; --idle-soft: rgba(141,145,156,.12);
  --scrim: rgba(0,0,0,.6);
  --shadow: 0 24px 60px -12px rgba(0,0,0,.7), 0 0 0 1px var(--line);
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f6f7f9; --bg-glow: rgba(91,140,255,.10); --panel: #ffffff; --panel-2: #fbfbfc; --line: #e6e7eb; --line-strong: #d6d8de;
  --fg: #0b0c0f; --muted: #646874; --faint: #9a9ea8; --accent: #2f63f0; --accent-2: #7a55f0; --accent-soft: rgba(47,99,240,.09); --on-accent: #ffffff;
  --ok: #12924a; --ok-soft: rgba(18,146,74,.10); --warn: #b07103; --warn-soft: rgba(176,113,3,.10); --bad: #d93a3a; --bad-soft: rgba(217,58,58,.09);
  --idle: #646874; --idle-soft: rgba(100,104,116,.10); --scrim: rgba(15,17,22,.35);
  --shadow: 0 24px 60px -16px rgba(15,17,22,.25), 0 0 0 1px var(--line); color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #f6f7f9; --bg-glow: rgba(91,140,255,.10); --panel: #ffffff; --panel-2: #fbfbfc; --line: #e6e7eb; --line-strong: #d6d8de;
  --fg: #0b0c0f; --muted: #646874; --faint: #9a9ea8; --accent: #2f63f0; --accent-2: #7a55f0; --accent-soft: rgba(47,99,240,.09); --on-accent: #ffffff;
  --ok: #12924a; --ok-soft: rgba(18,146,74,.10); --warn: #b07103; --warn-soft: rgba(176,113,3,.10); --bad: #d93a3a; --bad-soft: rgba(217,58,58,.09);
  --idle: #646874; --idle-soft: rgba(100,104,116,.10); --scrim: rgba(15,17,22,.35);
  --shadow: 0 24px 60px -16px rgba(15,17,22,.25), 0 0 0 1px var(--line); color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(1200px 500px at 70% -200px, var(--bg-glow), transparent 70%), var(--bg);
  background-attachment: fixed;
  color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
.row1 { display: flex; align-items: center; gap: 10px; height: 56px; }
.logo { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; flex: none; box-shadow: 0 0 18px -2px color-mix(in srgb, var(--accent) 60%, transparent); }
.logo svg { width: 13px; height: 13px; color: #fff; }
.slash { color: var(--line-strong); font-size: 20px; font-weight: 300; }
.crumb { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 5px 8px; border-radius: 8px; font-weight: 500; white-space: nowrap; }
.crumb:hover { background: var(--panel-2); }
.crumb .av { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #ef4444); display: grid; place-items: center; font-size: 10px; color: #fff; font-weight: 600; }
.crumb .tag { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); padding: 0 6px; border-radius: 999px; }
.crumb svg { width: 14px; height: 14px; color: var(--faint); }
.grow { flex: 1; }
.kbtn { display: inline-flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px 6px 12px; color: var(--muted); min-width: 220px; }
.kbtn:hover { border-color: var(--line-strong); }
.kbtn svg { width: 14px; height: 14px; }
.kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; color: var(--muted); background: var(--panel-2); margin-left: auto; }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: none; border: 1px solid transparent; color: var(--muted); }
.iconbtn:hover { background: var(--panel-2); color: var(--fg); }
.iconbtn svg { width: 16px; height: 16px; }
.me { width: 30px; height: 30px; border-radius: 50%; border: 0; background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; font-weight: 600; font-size: 12px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -8px; }
.tabs button { position: relative; background: none; border: 0; padding: 10px 12px 12px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.tabs button:hover { color: var(--fg); }
.tabs button .c { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.tabs button[aria-current="page"] { color: var(--fg); }
.tabs button[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--fg); }

/* Menu */
.menu { position: absolute; z-index: 40; min-width: 240px; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; animation: pop .14s ease-out; }
.menu .h { font-size: 11px; color: var(--faint); padding: 6px 10px 4px; text-transform: uppercase; letter-spacing: .06em; }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 8px 10px; border-radius: 8px; text-align: left; }
.menu button:hover, .menu button.on { background: var(--panel-2); }
.menu button small { margin-left: auto; color: var(--faint); font-size: 12px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }

/* Page */
.page { max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 28px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.025em; text-wrap: balance; }
.head p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; color: var(--muted); font-size: 13px; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 14px; font-weight: 500; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { border-color: var(--line-strong); background: var(--panel-2); }
.btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.primary:hover { opacity: .9; background: var(--fg); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; border-radius: 7px; }
.btn.danger { color: var(--bad); }
.btn svg { width: 14px; height: 14px; }
.section-t { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-t h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }

/* Usage */
.usage { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ucard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.ucard .k { color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; }
.ucard .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ucard .v small { font-size: 13px; color: var(--faint); font-weight: 400; letter-spacing: 0; }
.ucard svg.spark { width: 100%; height: 44px; margin-top: 4px; display: block; }
.bar-mini { height: 4px; border-radius: 4px; background: var(--panel-2); overflow: hidden; margin-top: 6px; }
.bar-mini i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.bar-mini i.hi { background: var(--warn); }

/* Filter chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chips button:hover { color: var(--fg); border-color: var(--line-strong); }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }

/* Resource cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-align: left; transition: border-color .15s, transform .15s, box-shadow .15s; min-width: 0; }
.card:hover { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: 0 10px 30px -18px rgba(0,0,0,.6); }
.card .top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ricon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); flex: none; color: var(--muted); }
.ricon svg { width: 16px; height: 16px; }
.card .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .ty { font-size: 12px; color: var(--faint); }
.card .top .st { margin-left: auto; }
.card .info { color: var(--muted); font-size: 12.5px; font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card svg.spark { width: 100%; height: 36px; display: block; }
.card .err { color: var(--bad); font-size: 12.5px; background: var(--bad-soft); border-radius: 8px; padding: 8px 10px; }
.card.new { border-style: dashed; background: transparent; align-items: center; justify-content: center; color: var(--muted); min-height: 150px; }
.card.new:hover { color: var(--fg); background: var(--panel); }
.card.new svg { width: 18px; height: 18px; }

.dot { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 20%, transparent); }
.dot.running { color: var(--ok); }
.dot.pending, .dot.provisioning, .dot.deleting { color: var(--warn); }
.dot.pending::before, .dot.provisioning::before, .dot.deleting::before { animation: pulse 1.2s ease-in-out infinite; }
.dot.failed { color: var(--bad); }
.dot.stopped, .dot.sleeping { color: var(--idle); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent; opacity: .5; } }
.badge { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.llm { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.badge.emb { color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 14%, transparent); border-color: transparent; }
.badge.dec { color: var(--warn); background: var(--warn-soft); border-color: transparent; }

/* Activity */
.feed { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 0; }
.feed h3 { margin: 0; font-size: 13px; font-weight: 600; padding: 10px 16px 6px; }
.feed ol { list-style: none; margin: 0; padding: 0 16px 8px; position: relative; }
.feed li { position: relative; padding: 8px 0 8px 20px; font-size: 13px; }
.feed li::before { content: ""; position: absolute; left: 4px; top: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.feed li::after { content: ""; position: absolute; left: 7px; top: 24px; bottom: -8px; width: 1px; background: var(--line); }
.feed li:last-child::after { display: none; }
.feed li.ok::before { background: var(--ok); } .feed li.bad::before { background: var(--bad); } .feed li.warn::before { background: var(--warn); }
.feed time { display: block; color: var(--faint); font-size: 11.5px; font-family: var(--font-mono); }

/* Code */
.code { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.code .tabs2 { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 6px; align-items: center; }
.code .tabs2 button { background: none; border: 0; padding: 4px 10px; border-radius: 6px; color: var(--muted); font-size: 12.5px; }
.code .tabs2 button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7; color: var(--fg); }
.code pre .c1 { color: var(--faint); } .code pre .s { color: var(--ok); } .code pre .k { color: var(--accent-2); }
.copy { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px; min-width: 0; }
.copy code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-family: var(--font-mono); font-size: 12.5px; }

.endpoint { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.endpoint h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.endpoint p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.models { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.model { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.model .mid { font-family: var(--font-mono); font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.model p { margin: 0; color: var(--muted); font-size: 12.5px; }
.model .ctx { color: var(--faint); font-size: 11.5px; font-family: var(--font-mono); }

/* Sheet + dialog */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; top: 8px; right: 8px; bottom: 8px; width: min(520px, calc(100% - 16px)); background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); z-index: 31; display: flex; flex-direction: column; animation: slide .2s cubic-bezier(.2,.8,.2,1); }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.sheet header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
.sheet header h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.sheet header .ty { color: var(--muted); font-size: 12.5px; }
.sheet .body { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
.sheet .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.logs { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--muted); max-height: 220px; overflow: auto; white-space: pre; }
.logs b { color: var(--fg); font-weight: 400; } .logs .e { color: var(--bad); }
.lbl { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }

.dialog { position: fixed; left: 50%; top: 10vh; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); max-height: 80vh; background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); z-index: 31; display: flex; flex-direction: column; animation: pop .16s ease-out; }
.dialog header { padding: 20px 22px 0; }
.dialog header h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
.dialog header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.dialog form { overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; }
.dialog footer { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.dialog footer .cost { margin-right: auto; color: var(--muted); font-size: 12.5px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .fl { font-size: 13px; font-weight: 500; }
.field .hint { color: var(--faint); font-size: 12px; }
.field input:not([type=radio]):not([type=checkbox]), .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; width: 100%; transition: border-color .12s, box-shadow .12s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea { font-family: var(--font-mono); font-size: 12px; min-height: 64px; resize: vertical; }
.prefix { display: flex; align-items: stretch; }
.prefix input { border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important; }
.prefix span { border: 1px solid var(--line); border-left: 0; border-radius: 0 9px 9px 0; padding: 8px 11px; color: var(--faint); font-family: var(--font-mono); font-size: 12px; background: var(--panel-2); white-space: nowrap; display: flex; align-items: center; }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; height: 100%; transition: border-color .12s, background .12s; }
.opt span:hover { border-color: var(--line-strong); }
.opt b { font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; }
.opt small { color: var(--muted); font-size: 12px; }
.opt em { font-style: normal; color: var(--faint); font-size: 11.5px; font-family: var(--font-mono); }
.opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.switch input { appearance: none; width: 32px; height: 18px; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }
.mlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mlist label { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mlist label:last-child { border-bottom: 0; }
.mlist label:hover { background: var(--panel-2); }
.mlist .badge { margin-left: auto; }
.mlist input { accent-color: var(--accent); }

/* Palette */
.palette { position: fixed; left: 50%; top: 14vh; transform: translateX(-50%); width: min(600px, calc(100% - 32px)); background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); z-index: 41; overflow: hidden; animation: pop .14s ease-out; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 16px 18px; font-size: 15px; outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 340px; overflow-y: auto; }
.palette li .h { font-size: 11px; color: var(--faint); padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: .06em; }

function spark(vals, color = 'var(--accent)', h = 36) {
  const w = 200, n = vals.length, id = 'g' + Math.floor(Math.random() * 1e9);
  const pts = vals.map((v, i) => [i / (n - 1) * w, h - 2 - v * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[n - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}

};

function sheet() {
  const r = S.res[S.sheet]; if (!r) return '';
  let body = '';
  const kv = (o) => `<dl class="kv">${Object.entries(o).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  if (r.t === 'vm') body = `
    <div class="acts">${r.status === 'running' ? `<button class="btn sm" data-act="stop">Stop</button><button class="btn sm" data-act="restart">Restart</button>` : r.status === 'stopped' ? `<button class="btn sm" data-act="start">Start</button>` : ''}<button class="btn sm" data-toast="Opens a serial console in the browser">${I.term}Console</button><button class="btn sm danger" data-act="delete">Delete</button></div>
    <div><div class="lbl" style="margin-bottom:8px">SSH</div><div class="copy"><code>ssh debian@${r.name}.${S.project}.vm.pmservers.org</code><button class="btn sm" data-copy="ssh debian@${r.name}.${S.project}.vm.pmservers.org">Copy</button></div></div>
    ${r.spark && r.status === 'running' ? `<div><div class="lbl" style="margin-bottom:8px">CPU, last hour</div>${spark(r.spark, 'var(--accent)', 60)}</div>` : ''}
    ${kv({ Size: `<span class="mono">${r.size}</span> · ${SIZES.find((s) => s[0] === r.size)?.slice(1, 3).join(' · ')}`, Image: r.image, 'Private IP': `<span class="mono">${r.ip || '—'}</span>`, Disk: '10 GB', Created: r.age + ' ago' })}`;
  if (r.t === 'ct') body = `
    <div class="acts"><button class="btn sm" data-toast="Opens ${r.host}">${I.ext}Open URL</button><button class="btn sm" data-act="redeploy">Redeploy</button><button class="btn sm danger" data-act="delete">Delete</button></div>
    ${r.err ? `<div class="card err" style="padding:12px 14px">${esc(r.err)}</div>` : ''}
    ${kv({ URL: `<a class="lnk mono" href="#" data-toast="Opens ${r.host}">${r.host}</a>`, Image: `<span class="mono">${esc(r.image)}</span>`, Replicas: r.replicas, Port: '8080', 'Scale to zero': 'After 15 min idle' })}
    <div><div class="lbl" style="margin-bottom:8px">Logs</div><div class="logs">${r.err
      ? `<span class="e">Failed to pull image "${esc(r.image)}"</span>\n<span class="e">401 Unauthorized</span>\nBack-off pulling image. Next try in 40s.`
      : `<b>14:01:02</b> listening on :8080\n<b>14:01:40</b> GET /healthz 200 1ms\n<b>14:02:13</b> POST /classify 200 212ms\n<b>14:02:15</b> decision=respond score=0.83\n<b>14:03:51</b> POST /classify 200 188ms\n<b>14:03:51</b> decision=ignore score=0.12`}</div></div>`;
  if (r.t === 's3') body = `
    <div class="acts"><button class="btn sm" data-toast="New access key. Shown once.">Create access key</button><button class="btn sm danger" data-act="delete">Delete</button></div>
    ${kv({ Endpoint: '<span class="mono">https://s3.pmservers.org</span>', Bucket: `<span class="mono">${r.name}</span>`, Used: r.used + ' of 10 GB limit', Objects: r.objects, Access: r.access })}
    <div class="code"><pre><span class="k">aws</span> s3 ls s3://${r.name} \\
  --endpoint-url https://s3.pmservers.org</pre></div>`;
  if (r.t === 'ai') body = `
    <div class="acts"><button class="btn sm" data-toast="Old key stops working in 24 h">Rotate key</button><button class="btn sm danger" data-act="delete">Revoke</button></div>
    <div><div class="lbl" style="margin-bottom:8px">Spend this month</div>
      <div style="font-size:22px;font-weight:600" class="num">$${r.spend.toFixed(2)} <span class="muted" style="font-size:13px;font-weight:400">of $${r.budget.toFixed(2)}</span></div>
      <div class="bar-mini"><i style="width:${r.spend / r.budget * 100}%"></i></div>${r.spark ? spark(r.spark, 'var(--accent-2)', 60) : ''}</div>
    ${kv({ Key: `<span class="mono">${r.prefix}••••••••</span>`, Models: r.models.map((m) => `<span class="badge mono">${m}</span>`).join(' '), 'Rate limit': '60 requests / min', Created: r.age + ' ago' })}`;
  return `<div class="scrim" data-close></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(r.name)}">
    <header><span class="ricon">${TYPE[r.t][1]}</span><div style="min-width:0"><h3>${esc(r.name)}</h3><div class="ty">${TYPE[r.t][0]} · ${esc(S.project)}</div></div><span style="margin-left:auto">${dot(r.status)}</span><button class="iconbtn" data-close aria-label="Close">✕</button></header>
    <div class="body">${body}</div></aside>`;
}

function dialog() {
  const t = S.dialog;
  const forms = {
    vm: ['Create virtual machine', 'It takes about one minute to start.', `
      <div class="field"><label for="f-name">Name</label><div class="prefix"><input id="f-name" name="name" value="worker-1" required pattern="[a-z0-9-]+"><span>.${esc(S.project)}.vm</span></div></div>
      <div class="field"><span class="fl">Size</span><div class="opts">${SIZES.map(([k, c, m], i) => `<label class="opt"><input type="radio" name="size" value="${k}" ${i === 1 ? 'checked' : ''}><span><b>${k}</b><small>${c} · ${m}</small></span></label>`).join('')}</div></div>
      <div class="field"><span class="fl">Image</span><div class="opts">${['Debian 13', 'Ubuntu 24.04', 'Alpine 3.22', 'Fedora 43'].map((x, i) => `<label class="opt"><input type="radio" name="image" value="${x}" ${i === 0 ? 'checked' : ''}><span><b style="font-family:var(--font-ui)">${x.split(' ')[0]}</b><small>${x.split(' ')[1]}</small></span></label>`).join('')}</div></div>
      <div class="field"><label for="f-key">SSH public key</label><textarea id="f-key" name="key">ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK3x… robert@laptop</textarea><span class="hint">We add it to the default user.</span></div>`, 'Create VM'],
    ct: ['Deploy container', 'Any public image, or a private one with a registry credential.', `
      <div class="field"><label for="c-img">Image</label><input id="c-img" name="image" value="ghcr.io/robert/hello-web:latest"></div>
      <div class="field"><label for="c-name">Name</label><div class="prefix"><input id="c-name" name="name" value="hello-web" required pattern="[a-z0-9-]+"><span>.${esc(S.project)}.pmservers.app</span></div></div>
      <div class="field"><label for="c-port">Port</label><input id="c-port" name="port" type="number" value="8080"></div>
      <div class="field"><span class="fl">Size</span><div class="opts two"><label class="opt"><input type="radio" name="csize" checked><span><b>0.25 vCPU</b><small>256 MiB</small></span></label><label class="opt"><input type="radio" name="csize"><span><b>0.5 vCPU</b><small>512 MiB</small></span></label></div></div>
      <div class="field"><label for="c-env">Environment variables</label><textarea id="c-env" name="env">LOG_LEVEL=info</textarea></div>
      <label class="switch"><input type="checkbox" id="c-zero" checked> Scale to zero when idle</label>`, 'Deploy'],
    s3: ['Create bucket', 'Names are global in PMS Cloud.', `
      <div class="field"><label for="b-name">Name</label><input id="b-name" name="name" value="media-uploads" required pattern="[a-z0-9-]+"></div>
      <div class="field"><label for="b-q">Size limit</label><div class="prefix"><input id="b-q" name="quota" type="number" value="10"><span>GB</span></div></div>
      <div class="field"><span class="fl">Access</span><div class="opts two"><label class="opt"><input type="radio" name="access" value="Private" checked><span><b style="font-family:var(--font-ui)">Private</b><small>Keys only</small></span></label><label class="opt"><input type="radio" name="access" value="Public read"><span><b style="font-family:var(--font-ui)">Public read</b><small>Anyone can GET</small></span></label></div></div>`, 'Create bucket'],
    ai: ['Create API key', 'You see the key only once. Keep it safe.', `
      <div class="field"><label for="k-name">Name</label><input id="k-name" name="name" value="rag-indexer" required></div>
      <div class="field"><span class="fl">Models</span><div class="mlist">${MODELS.map(([id, c, l]) => `<label><input type="checkbox" name="models" value="${id}" ${c !== 'llm' ? 'checked' : ''}><span class="mono">${id}</span><span class="badge ${c}">${l}</span></label>`).join('')}</div></div>
      <div class="field"><label for="k-b">Monthly budget</label><div class="prefix"><input id="k-b" name="budget" type="number" value="1" step="0.5" min="0"><span>USD</span></div></div>`, 'Create key'],
  };
  const [title, sub, body, cta] = forms[t];
  return `<div class="scrim" data-close></div><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt">
    <header><h3 id="dt">${title}</h3><p>${sub}</p></header>
    <form id="dform">${body}</form>
    <footer><span class="cost">Counts against project limits</span><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" form="dform" type="submit">${cta}</button></footer></div>`;
}

function menu() {
  if (!S.menu) return '';
  const { kind, x, y } = S.menu;
  let inner = '';
  if (kind === 'project') inner = `<div class="h">Projects</div>${['discord-bots', 'personal-site'].map((p) => `<button data-proj="${p}" class="${p === S.project ? 'on' : ''}">${p}<small>${p === S.project ? '✓' : ''}</small></button>`).join('')}<hr><button data-toast="Opens the new project form">${I.plus}New project</button>`;
  if (kind === 'new') inner = `<div class="h">Create</div>${[['vm', 'Virtual machine'], ['ct', 'Container'], ['s3', 'Bucket'], ['ai', 'AI API key']].map(([t, l]) => `<button data-new="${t}">${TYPE[t][1].replace('<svg', '<svg width="15" height="15"')}${l}</button>`).join('')}`;
  if (kind === 'me' || kind === 'account') inner = `<div class="h">robert@example.com</div><button data-view="settings">Settings</button><button id="theme2">Change theme</button><hr><button id="signout">${I.out.replace('<svg', '<svg width="15" height="15"')}Sign out</button>`;
  const right = kind === 'new' || kind === 'me';
  return `<div class="menu" style="top:${y}px;${right ? `right:${Math.max(16, innerWidth - x)}px` : `left:${x}px`}">${inner}</div>`;
}

function paletteItems() {
  const q = S.pq.toLowerCase();
  const items = [
    ...[['vm', 'Create virtual machine'], ['ct', 'Deploy container'], ['s3', 'Create bucket'], ['ai', 'Create AI API key']].map(([t, l]) => ({ g: 'Actions', l, ic: I.plus, run: () => openDialog(t) })),
    ...TABS.map(([id, l]) => ({ g: 'Go to', l, ic: I.home, run: () => go(id) })),
    ...S.res.map((r, i) => ({ g: 'Resources', l: r.name, sub: TYPE[r.t][0], ic: TYPE[r.t][1], run: () => { S.sheet = i; } })),
  ];
  return items.filter((x) => !q || x.l.toLowerCase().includes(q) || (x.sub || '').toLowerCase().includes(q));
}
function palette() {
  if (!S.palette) return '';
  const items = paletteItems();
  let g = '';
  return `<div class="scrim" data-close style="z-index:40"></div><div class="palette" role="dialog" aria-label="Command palette">
    <input id="pq" placeholder="Search resources or type a command…" value="${esc(S.pq)}" autocomplete="off">
    <ul>${items.map((x, i) => { const h = x.g !== g ? `<div class="h">${(g = x.g)}</div>` : ''; return `<li>${h}<button data-pi="${i}" class="${i === S.pi ? 'on' : ''}">${x.ic}${esc(x.l)}<small>${x.sub || ''}</small></button></li>`; }).join('') || '<li class="muted" style="padding:14px">No results</li>'}</ul>
    <div class="foot"><span>↑↓ to move</span><span>↵ to open</span><span>esc to close</span></div></div>`;
}

function auth() {
  return `<div class="auth">
    <div class="art">
      <div style="display:flex;align-items:center;gap:10px;font-weight:600"><span class="logo">${I.logo}</span>PMS Cloud</div>
      <h2>Your cloud, pretty manageable.</h2>
      <div class="term">$ pms vm create worker-1 --size pm.small<br><b>✓</b> worker-1 running in ca-tor-1 (41s)<br>$ pms ai keys create --model kev-4b<br><b>✓</b> pms_sk_••••••••3f1a</div>
    </div>
    <div class="form"><form id="login">
      <div><h1>Sign in</h1><p>Welcome back to the console.</p></div>
      <button class="btn" type="button" id="gh"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>Continue with GitHub</button>
      <div class="or">or</div>
      <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" value="robert@example.com"></div>
      <div class="field"><label for="l-pass" style="display:flex;justify-content:space-between">Password <a href="#" class="lnk" style="font-weight:400;font-size:12.5px">Forgot?</a></label><input id="l-pass" type="password" value="correct-horse"></div>
      <button class="btn primary" type="submit">Sign in</button>
      <div class="fine">No account? <a href="#">Sign up</a></div>
    </form></div></div>`;
}

function render() {
  const root = $('#root');
  if (!S.signedIn) { root.innerHTML = auth(); bindAuth(); return; }
  root.innerHTML = topbar() + `<main class="page">${VIEWS[S.view]()}</main>` + (S.sheet !== null ? sheet() : '') + (S.dialog ? dialog() : '') + menu() + palette();
  bind();
}

function toast(title, sub = '', color = 'var(--ok)') {
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = `<i style="background:${color}"></i><div>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3200);
}
const go = (v) => { S.view = v; S.filter = 'all'; S.menu = null; S.palette = false; };
const openDialog = (t) => { S.dialog = t; S.menu = null; S.palette = false; S.sheet = null; };
const closeAll = () => { S.sheet = null; S.dialog = null; S.menu = null; S.palette = false; };

// Simulates the frontend polling GET /resources/{id}: pending -> provisioning -> running.
function lifecycle(r, steps) {
  steps.forEach(([ms, st, fn]) => setTimeout(() => { r.status = st; fn && fn(); render(); }, ms));
}

function submit(form) {
  const d = new FormData(form), name = (d.get('name') || '').trim(), t = S.dialog;
  const r = { t, name, status: 'pending', age: 'now' };
  if (t === 'vm') Object.assign(r, { size: d.get('size'), image: d.get('image'), ip: '' });
  if (t === 'ct') Object.assign(r, { image: d.get('image'), host: `${name}.${S.project}.pmservers.app`, replicas: '0/1' });
  if (t === 's3') Object.assign(r, { used: '0 B', objects: '0', access: d.get('access') });
  if (t === 'ai') Object.assign(r, { prefix: 'pms_sk_' + Math.random().toString(16).slice(2, 6), models: d.getAll('models'), spend: 0, budget: +d.get('budget') || 1, status: 'running' });
  S.res.unshift(r);
  S.feed.unshift(['ok', 'Just now', `<b>${esc(name)}</b> create requested`]);
  S.dialog = null; S.view = t; render();
  if (t === 'ai') { toast('API key created', 'Copy it now. You see it only once.'); return; }
  toast(`Creating ${name}`, 'Status updates every few seconds.', 'var(--warn)');
  lifecycle(r, [[1400, 'provisioning'], [4800, 'running', () => { r.spark = series(32, .3, .3); if (t === 'vm') r.ip = '10.40.0.' + (40 + Math.floor(Math.random() * 120)); if (t === 'ct') r.replicas = '1/1'; toast(`${name} is running`); }]]);
}

function bind() {
  $$('[data-view]').forEach((b) => b.onclick = () => { go(b.dataset.view); render(); });
  $$('[data-filter]').forEach((b) => b.onclick = () => { S.filter = b.dataset.filter; render(); });
  $$('[data-open-res]').forEach((b) => b.onclick = () => { S.sheet = +b.dataset.openRes; render(); });
  $$('[data-new]').forEach((b) => b.onclick = () => { openDialog(b.dataset.new); render(); $('#dform input')?.focus(); });
  $$('[data-close]').forEach((b) => b.onclick = () => { closeAll(); render(); });
  $$('[data-toast]').forEach((b) => b.onclick = (e) => { e.preventDefault(); toast(b.dataset.toast); });
  $$('[data-code]').forEach((b) => b.onclick = () => { S.codeTab = b.dataset.code; render(); });
  $$('[data-proj]').forEach((b) => b.onclick = () => { S.project = b.dataset.proj; S.menu = null; render(); toast(`Switched to ${S.project}`); });
  $$('[data-copy]').forEach((b) => b.onclick = () => navigator.clipboard?.writeText(b.dataset.copy).then(() => toast('Copied to clipboard'), () => toast('Select the text to copy it')));
  $$('[data-menu]').forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const k = b.dataset.menu;
    if (S.menu?.kind === k) { S.menu = null; render(); return; }
    const rc = b.getBoundingClientRect();
    S.menu = { kind: k, x: k === 'new' || k === 'me' ? rc.right : rc.left, y: rc.bottom + window.scrollY + 6 };
    render();
  });
  $$('[data-act]').forEach((b) => b.onclick = () => {
    const r = S.res[S.sheet], a = b.dataset.act;
    if (a === 'delete') { lifecycle(r, [[0, 'deleting'], [2200, 'deleting', () => { S.res.splice(S.res.indexOf(r), 1); S.sheet = null; toast(`${r.name} deleted`); }]]); return; }
    const end = a === 'stop' ? 'stopped' : 'running';
    lifecycle(r, [[0, 'pending'], [2000, end, () => { if (a === 'redeploy') { r.err = null; r.replicas = '1/1'; r.spark = series(32, .4, .3); } toast(`${r.name} ${a === 'stop' ? 'stopped' : a === 'start' ? 'started' : a + 'ed'}`); }]]);
  });
  const f = $('#dform'); if (f) f.onsubmit = (e) => { e.preventDefault(); submit(f); };
  $('#kbtn').onclick = () => { S.palette = true; S.pq = ''; S.pi = 0; render(); $('#pq').focus(); };
  const th = () => { const d = document.documentElement, dark = d.dataset.theme ? d.dataset.theme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches; d.dataset.theme = dark ? 'light' : 'dark'; S.menu = null; render(); };
  $('#theme').onclick = th; if ($('#theme2')) $('#theme2').onclick = th;
  if ($('#signout')) $('#signout').onclick = () => { closeAll(); S.signedIn = false; render(); };
  const pq = $('#pq');
  if (pq) {
    pq.oninput = () => { S.pq = pq.value; S.pi = 0; render(); const n = $('#pq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    $$('[data-pi]').forEach((b) => b.onclick = () => { const it = paletteItems()[+b.dataset.pi]; S.palette = false; it.run(); render(); });
  }
}

document.addEventListener('click', (e) => { if (S.menu && !e.target.closest('.menu') && !e.target.closest('[data-menu]')) { S.menu = null; render(); } });
document.addEventListener('keydown', (e) => {
  if (!S.signedIn) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.palette = !S.palette; S.pq = ''; S.pi = 0; render(); $('#pq')?.focus(); return; }
  if (e.key === 'Escape' && (S.palette || S.sheet !== null || S.dialog || S.menu)) { closeAll(); render(); return; }
  if (S.palette && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
    e.preventDefault();
    const items = paletteItems();
    if (e.key === 'Enter' && items[S.pi]) { S.palette = false; items[S.pi].run(); render(); return; }
    S.pi = (S.pi + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % Math.max(1, items.length);
    render(); $('#pq').focus();
  }
});

function bindAuth() {
  const go2 = () => { S.signedIn = true; S.view = 'overview'; render(); toast('Signed in', 'robert@example.com'); };
  $('#login').onsubmit = (e) => { e.preventDefault(); go2(); };
  $('#gh').onclick = go2;
  $$('.auth a').forEach((a) => a.onclick = (e) => { e.preventDefault(); toast('Supabase Auth handles this'); });
}

render();
</script>
